<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment1-Farzaan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Trebuchet MS", Verdana, sans-serif;
            background: #f3eee7;
            color: #292929;
        }

        .container {
            width: 92%;
            max-width: 480px;
            background: #fffdf9;
            padding: 29px 34px;
            border: 2px solid #6c8b83;
            border-radius: 9px;
            box-shadow: 7px 8px 0 #d8c8b8;
        }

        h1 {
            text-align: center;
            margin-top: 2px;
            margin-bottom: 25px;
            color: #514365;
            font-size: 27px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 9px 11px;
            margin-bottom: 16px;
            border: 1.5px solid #9c8eaa;
            border-radius: 5px;
            background: #fff;
            font-family: "Trebuchet MS", Verdana, sans-serif;
            font-size: 14px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: 2px solid #d98b73;
            border-color: #d98b73;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        select {
            cursor: pointer;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 3px 0 20px;
        }

        .terms input {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        .terms label {
            margin: 0;
            font-weight: normal;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #596f68;
            color: #fffdf9;
            border: 2px solid #42564f;
            border-radius: 5px;
            font-family: "Trebuchet MS", Verdana, sans-serif;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #485f57;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Rental Housing Listing</h1>

        <form id="rentalForm">
            <label for="propertyTitle">Property Name</label>
            <input
                type="text"
                id="propertyTitle"
                name="propertyTitle"
                placeholder="Enter the rental listing title"
                required
                autofocus
            >

            <label for="location">Location</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter the property location"
                required
            >

            <label for="submitterEmail">Email</label>
            <input
                type="email"
                id="submitterEmail"
                name="submitterEmail"
                placeholder="Enter your email address"
                required
            >

            <label for="description">Property Details</label>
            <textarea
                id="description"
                name="description"
                placeholder="Describe the rental property"
                required
            ></textarea>

            <label for="propertyType">Property Type</label>
            <select id="propertyType" name="propertyType">
                <option value="Apartment">Apartment</option>
                <option value="House">House</option>
                <option value="Condominium">Condominium</option>
                <option value="Townhouse">Townhouse</option>
            </select>

            <div class="terms">
                <input
                    type="checkbox"
                    id="termsAccepted"
                    name="termsAccepted"
                >
                <label for="termsAccepted">
                    I agree to the terms and conditions
                </label>
            </div>

            <button type="submit">Submit Listing</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
