<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Rental Housing Listings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Rental Housing Listings</a>
        </div>
    </nav>
    <main class="d-flex align-items-center justify-content-center px-3" style="min-height: calc(100vh - 56px);">
        <div class="card shadow-sm rounded-3 w-100" style="max-width: 720px;">
            <div class="card-body text-center p-4 p-md-5">
                <h1 class="h2 mb-3">Welcome, {{ name }}</h1>
                <p class="text-secondary mb-4">You are signed in to the Rental Housing Listings application.</p>
                <div class="d-flex justify-content-center flex-wrap gap-2">
                    <a class="btn btn-primary px-4" href="/listings-ui">Rental Listings</a>
                    <a class="btn btn-outline-primary px-4" href="/">Home</a>
                    <a class="btn btn-outline-secondary px-4" href="/logout">Logout</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
