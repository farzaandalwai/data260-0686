<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Rental Housing Listings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Rental Housing Listings</a>
        </div>
    </nav>
    <main class="d-flex align-items-center justify-content-center px-3" style="min-height: calc(100vh - 56px);">
        <div class="card shadow-sm rounded-3 w-100" style="max-width: 460px;">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 text-center mb-1">Login</h1>
                <p class="text-secondary text-center mb-4">Rental Housing Listings</p>
                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                <form method="post" action="/login">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-control" id="username" name="username" type="text" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" id="password" name="password" type="password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Login</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
